[data]
file = "data/brett2024_ic_traveltimes.parquet"

[mesh]
radius = 1221.5
radial_resolution = 4
lateral_resolution = 5

[components]

[[components.inferred]]
A = { builder = "forward.build_forward", kwargs = { normalisation = 0.5 } }
C = { builder = "prior.iid", kwargs = { scale = 0.01} }
mu = { builder = "prior.zero_mean", kwargs = {} }

[[components.nuisance]]
A = { builder = "forward.eye", kwargs = { scale = 1.0 } }
C = { builder = "noise.block_iid", kwargs = {} }
mu = { builder = "noise.zero_mean", kwargs = {} }

[output]
prefix = "outputs"
