[data]
file = "data/brett2024_ic_traveltimes.parquet"

[mesh]
radius = 1221.5
radial_resolution = 4
lateral_resolution = 5

[components]

[[components.inferred]]
A = { builder = "forward.build_forward", kwargs = { normalisation = 0.5 } }
C = { builder = "prior.iid", kwargs = { scale = 0.1} }
mu = { builder = "main:prior_mean", kwargs = {} }

[[components.nuisance]]
A = { builder = "main:eye", kwargs = {} }
C = { builder = "noise:block_iid", kwargs = {} }
mu = { builder = "main:noise_mean", kwargs = {} }

[output]
prefix = "outputs"
